[package]
name = "jv-desktop"
publish = false
description = "Desktop workspace for JV CLI"
authors = ["VMatee <VMatee@users.noreply.github.com>"]
homepage = "https://github.com/VMatee/jv-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "jv_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
tauri = { version = "2.12.0", features = [] }
tauri-plugin-dialog = "2.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
jv-desktop-process = { path = "../crates/jv-process" }

[dev-dependencies]
tauri = { version = "2.12.0", features = ["test"] }
