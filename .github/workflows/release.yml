name: Linux release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      RUSTUP_HOME: ${{ github.workspace }}/.tools/rustup
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Require matching version, green main checks, and no existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$version"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/checks.yml/runs?head_sha=$GITHUB_SHA&event=push" > checks.json
          node -e 'const r=require("./checks.json").workflow_runs; if(!r.some(x=>x.head_branch==="main" && x.conclusion==="success")) process.exit(1)'
          rm checks.json
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          node -e 'if(require("./releases.json").some(x=>x.tag_name===process.env.GITHUB_REF_NAME)) process.exit(1)'
          rm releases.json
      - name: Provision ephemeral Linux build runner
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.98.1
      - run: npm ci
      - name: Offline release filename and checksum round-trip tests
        run: python3 -B -m unittest discover -s tests -p 'test_release*.py' -v
      - run: npm run tauri:check
      - run: npm run tauri:test
      - name: Build production bundles from tagged source
        run: npm run tauri -- build --bundles deb,rpm,appimage
      - name: Inspect and collect release assets
        run: |
          dpkg-deb --info "target/release/bundle/deb/JV Desktop_${RELEASE_VERSION}_amd64.deb"
          dpkg-deb --contents "target/release/bundle/deb/JV Desktop_${RELEASE_VERSION}_amd64.deb"
          rpm -qip "target/release/bundle/rpm/JV Desktop-${RELEASE_VERSION}-1.x86_64.rpm"
          rpm -qlp "target/release/bundle/rpm/JV Desktop-${RELEASE_VERSION}-1.x86_64.rpm"
          file target/release/jv-desktop "target/release/bundle/appimage/JV Desktop_${RELEASE_VERSION}_amd64.AppImage"
          python3 scripts/release-assets.py
          cd "target/release-assets/$RELEASE_VERSION"
          sha256sum -c SHA256SUMS
      - name: Require safe complete release inventory before publication
        run: python3 -B scripts/release-assets.py --verify "target/release-assets/$RELEASE_VERSION"
      - name: Publish without replacing existing releases or assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "target/release-assets/$RELEASE_VERSION/"* --verify-tag --latest \
            --title "JV Desktop $RELEASE_VERSION" --notes-file "docs/releases/$RELEASE_VERSION.md"
      - name: Verify published bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache
          for pass in 1 2; do
            downloaded=$(mktemp -d "$GITHUB_WORKSPACE/.cache/published-${RELEASE_VERSION}-${pass}.XXXXXX")
            gh release download "$GITHUB_REF_NAME" --dir "$downloaded"
            python3 -B scripts/release-assets.py --verify "$downloaded"
            (cd "$downloaded" && sha256sum -c SHA256SUMS)
            cmp "$downloaded/SHA256SUMS" "target/release-assets/$RELEASE_VERSION/SHA256SUMS"
            cmp "$downloaded/BUILD-INFO.json" "target/release-assets/$RELEASE_VERSION/BUILD-INFO.json"
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq '.assets' > .cache/published-assets.json
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          source = pathlib.Path('target/release-assets') / os.environ['RELEASE_VERSION']
          assets = json.loads(pathlib.Path('.cache/published-assets.json').read_text())
          assert len(assets) == len(list(source.iterdir()))
          assert {a['name'] for a in assets} == {p.name for p in source.iterdir()}
          for asset in assets:
              path = source / asset['name']
              assert asset['size'] == path.stat().st_size
              expected = 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest()
              if asset.get('digest'):
                  assert asset['digest'] == expected
              print(asset['name'], asset['size'], expected, 'API digest verified' if asset.get('digest') else 'API digest unavailable')
          PY
