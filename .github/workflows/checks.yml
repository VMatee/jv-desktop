name: Desktop checks
on:
  push:
    branches: [main, feature/bridge-client, feature/windows-native, feature/structured-vision-windows]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shared:
    name: Desktop native checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_HOME: ${{ github.workspace }}/.cache/cargo
      RUSTUP_HOME: ${{ github.workspace }}/.tools/rustup
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install Rust into job-local toolchain directory
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.98.1
      - run: npm ci
      - name: Native GUI acceptance driver syntax (manual actions are opt-in)
        run: node --check scripts/windows-native-gui-acceptance.mjs
      - name: Windows GUI process watcher syntax
        if: runner.os == 'Windows'
        run: python -B -c "import ast,pathlib; ast.parse(pathlib.Path('scripts/windows-gui-process-watch.py').read_text(encoding='utf-8'))"
      - name: Linux parse check for Windows-only GUI watcher
        if: runner.os == 'Linux'
        run: python3 -B -c "import ast,pathlib; ast.parse(pathlib.Path('scripts/windows-gui-process-watch.py').read_text(encoding='utf-8'))"
      - name: Linux Tauri development libraries (ephemeral runner only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm test
      - name: Offline release asset contracts
        if: runner.os == 'Linux'
        run: python3 -B -m unittest discover -s tests -p 'test_release*.py' -v
      - name: Windows offline release asset contracts
        if: runner.os == 'Windows'
        run: python -B -m unittest discover -s tests -p 'test_release*.py' -v
      - run: npm run build
      - run: npm run rust:fmt
      - run: npm run rust:check
      - run: npm run rust:test
      - run: npm run rust:clippy
      - name: Offline browser acceptance (only loopback network permitted)
        if: runner.os == 'Linux'
        run: |
          npm run browser:install
          npm run test:e2e
      - run: npm run tauri:check
      - run: npm run tauri:test
      - name: Native desktop executable build (no release/publication)
        if: runner.os == 'Windows'
        run: npm run tauri -- build --no-bundle
      # Native lifecycle uses public offline fixtures only. No JV credentials,
      # production jobs, CLI installation, tagging or publication is performed.
