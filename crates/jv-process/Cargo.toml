[package]
name = "jv-desktop-process"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-fixture = []

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO"] }

[[bin]]
name = "fake-jvcli"
path = "tests/fixtures/fake_jvcli.rs"
required-features = ["test-fixture"]

[[bin]]
name = "fake-bridge"
path = "tests/fixtures/fake_bridge.rs"
required-features = ["test-fixture"]

[[bin]]
name = "bridge-owner"
path = "tests/fixtures/bridge_owner.rs"
required-features = ["test-fixture"]
